name: Publish
on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - profile.toml
      - scripts/generate_readme.py
      - .github/workflows/publish.yml
jobs:
  generate-readme:
    environment: release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Generate app token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: Iv23liUsXGDICnIdo3Ev
          private-key: ${{ secrets.SR_RELEASER_PRIVATE_KEY }}
          repositories: ${{ github.event.repository.name }}

      - uses: actions/checkout@v6
        with:
          token: ${{ steps.app-token.outputs.token }}

      - name: Generate README
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/generate_readme.py

      - name: Commit and push
        run: |
          if git diff --quiet -- README.md; then
            echo "README is up to date."
            exit 0
          fi
          git config user.name "sr-releaser[bot]"
          git config user.email "sr-releaser[bot]@users.noreply.github.com"
          git commit -m "chore: update profile README" -- README.md
          git push
