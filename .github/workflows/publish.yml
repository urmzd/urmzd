name: Publish
on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - profile.toml
      - "scripts/**"
      - "tests/**"
      - assets/style.d2
      - assets/light.d2
      - assets/dark.d2
      - .github/workflows/publish.yml
concurrency:
  group: profile-publish
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  generate-readme:
    timeout-minutes: 15
    environment: release
    runs-on: ubuntu-latest
    steps:
      - name: Generate app token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: Iv23liUsXGDICnIdo3Ev
          private-key: ${{ secrets.SR_RELEASER_PRIVATE_KEY }}
          repositories: ${{ github.event.repository.name }}

      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - uses: actions/setup-go@v6
        with:
          go-version: "1.24.2"
          cache: false

      - name: Install pinned diagram renderer
        run: go install oss.terrastruct.com/d2@v0.7.1

      - name: Validate, generate, and publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/publish_profile.sh
